name: MC2 trial error visibility
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mc2-trial-error.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch trial-match error handling
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('match2.html')
          s=p.read_text()
          old="""  }catch(e){}\n}\n\nasync function endTrialMatch(){"""
          new="""  }catch(e){\n    toast(e && e.message ? e.message : 'Could not create trial match');\n  }\n}\n\nasync function endTrialMatch(){"""
          if old not in s:
              raise SystemExit('Target block not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add match2.html
          git commit -m "Show MC2 trial match errors"
          git push
