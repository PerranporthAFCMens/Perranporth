name: Restore exact MC2 file

on:
  push:
    paths:
      - '.github/workflows/mc2-restore.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact package file
        shell: bash
        run: |
          cat .mc2parts/p00.txt .mc2parts/p01.txt .mc2parts/p02.txt .mc2parts/p03.txt .mc2parts/p04.txt .mc2parts/p05.txt .mc2parts/p06.txt .mc2parts/p07.txt | base64 -d | gzip -d > match2.html
          actual="$(git hash-object match2.html)"
          expected="597ef0aa3957b8cf0f04206da98074eae55238f8"
          if [ "$actual" != "$expected" ]; then
            echo "SHA mismatch: $actual"
            exit 1
          fi
          rm -rf .mc2parts
          rm -f .github/workflows/mc2-restore.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish exact Match Centre 2 test page"
          git push
