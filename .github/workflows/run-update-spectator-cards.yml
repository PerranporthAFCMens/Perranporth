name: Apply prepared backend patch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-update-spectator-cards.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python .github/scripts/update_spectator_cards.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps-script/code.gs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add management access roles and email PIN resets"
          git push
