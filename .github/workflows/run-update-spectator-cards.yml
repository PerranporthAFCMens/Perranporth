name: Update spectator card indicators
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-update-spectator-cards.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/update_spectator_cards.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live.html
          git commit -m "Show cards on spectator lineup"
          git push
