name: MC2 punch list fixes

on:
  push:
    paths:
      - '.github/workflows/mc2-punchlist.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply MC2 frontend fixes
        shell: python
        run: |
          from pathlib import Path
          p=Path('match2.html')
          s=p.read_text()

          def rep(old,new,label):
              global s
              if old not in s:
                  raise SystemExit(f'Missing expected block: {label}')
              s=s.replace(old,new,1)

          # Share Result only after Full Time.
          rep('''          <button class="btn secondary full" style="margin-top:10px" onclick="openLineupBuilder()">Lineup / Subs Board</button>\n          <button class="btn secondary full" style="margin-top:7px" onclick="shareResult(currentMatchId)">Share Result</button>''',
              '''          <button class="btn secondary full" style="margin-top:10px" onclick="openLineupBuilder()">Lineup / Subs Board</button>''',
              'remove live share result')
          rep('''      <button id="finishMatchBtn" class="btn danger full" onclick="showFinishMatchConfirm()">Finish Match</button>\n      <button class="btn secondary full" style="margin-top:7px" onclick="showView('home')">Back to Home</button>''',
              '''      <button id="finishMatchBtn" class="btn danger full" onclick="showFinishMatchConfirm()">Finish Match</button>\n      <button id="shareResultBtn" class="btn green full hidden" style="margin-top:7px" onclick="shareResult(currentMatchId)">Share Result</button>\n      <button class="btn secondary full" style="margin-top:7px" onclick="showView('home')">Back to Home</button>''',
              'add completed share result')

          # Back-to-match button gets immediate double-tap protection.
          rep('''          <button class="btn secondary" onclick="returnToCurrentMatch()">Back to Match</button>''',
              '''          <button id="lineupBackToMatchBtn" class="btn secondary" onclick="returnToCurrentMatch()">Back to Match</button>''',
              'lineup back button id')
          rep('''          <button class="btn secondary full" style="margin-top:7px" onclick="returnToCurrentMatch()">Back to Match</button>''',
              '''          <button id="squadBackToMatchBtn" class="btn secondary full" style="margin-top:7px" onclick="returnToCurrentMatch()">Back to Match</button>''',
              'squad back button id')
          rep("let lineupState=[],lineupDrag=null,lineupSuppressClickUntil=0;",
              "let lineupState=[],lineupDrag=null,lineupSuppressClickUntil=0,returnToMatchBusy=false;",
              'return busy state')

          # Default formation becomes 4-2-3-1 and merge fresh squad additions into bench.
          rep("const formation=(saved&&saved.formation&&LINEUP_PRESETS[saved.formation])?saved.formation:'4-3-3';",
              "const formation=(saved&&saved.formation&&LINEUP_PRESETS[saved.formation])?saved.formation:'4-2-3-1';",
              'default formation')
          rep('''  const [saved,squad]=await Promise.all([\n    call('getLineup',PIN,currentMatchId),\n    call('getSquad',PIN,currentMatchId)\n  ]);''',
              '''  const [saved,squad,allPlayers]=await Promise.all([\n    call('getLineup',PIN,currentMatchId),\n    call('getSquad',PIN,currentMatchId),\n    call('getAllPlayersForAdmin',PIN)\n  ]);\n\n  if(Array.isArray(allPlayers)){\n    DATA.allPlayers=allPlayers;\n    DATA.players=allPlayers.filter(p=>p.active!==false);\n  }''',
              'refresh players entering lineup')
          rep('''  if(saved&&saved.positions&&saved.positions.length){\n    lineupState=saved.positions.map((p,i)=>({\n      player:p.player,area:p.area,x:Number(p.x||50),y:Number(p.y||50),\n      order:Number(p.order||i+1),slot:p.area==='Pitch'?Math.max(0,Math.min(10,Number(p.order||i+1)-1)):null\n    }));''',
              '''  if(saved&&saved.positions&&saved.positions.length){\n    lineupState=saved.positions.map((p,i)=>({\n      player:p.player,area:p.area,x:Number(p.x||50),y:Number(p.y||50),\n      order:Number(p.order||i+1),slot:p.area==='Pitch'?Math.max(0,Math.min(10,Number(p.order||i+1)-1)):null\n    }));\n    const already=new Set(lineupState.map(p=>p.player));\n    (squad||[]).forEach(p=>{\n      if(p&&p.player&&!already.has(p.player)){\n        lineupState.push({player:p.player,area:'Bench',x:0,y:0,slot:null,order:lineupState.filter(x=>x.area==='Bench').length+1});\n        already.add(p.player);\n      }\n    });''',
              'merge squad into saved lineup')

          # Back to Match locks immediately.
          rep('''async function returnToCurrentMatch(){\n  if(!currentMatchId){\n    showView('home');\n    return;\n  }\n  try{\n    currentSummary=await call('getMatchSummary',PIN,currentMatchId);\n    showView('match');\n    renderSummary(currentSummary);\n    applyClockState_(currentSummary.clock);\n  }catch(e){\n    showView('home');\n  }\n}''',
              '''async function returnToCurrentMatch(){\n  if(returnToMatchBusy)return;\n  returnToMatchBusy=true;\n  const buttons=['lineupBackToMatchBtn','squadBackToMatchBtn'].map(id=>document.getElementById(id)).filter(Boolean);\n  buttons.forEach(b=>{b.disabled=true;b.textContent='Opening…'});\n  if(!currentMatchId){\n    showView('home');\n    returnToMatchBusy=false;\n    return;\n  }\n  try{\n    currentSummary=await call('getMatchSummary',PIN,currentMatchId);\n    showView('match');\n    renderSummary(currentSummary);\n    applyClockState_(currentSummary.clock);\n  }catch(e){\n    showView('home');\n  }finally{\n    returnToMatchBusy=false;\n    buttons.forEach(b=>{b.disabled=false;b.textContent='Back to Match'});\n  }\n}''',
              'back to match lock')

          # Pause reacts immediately, then reconciles with server.
          rep('''async function toggleClock(){\n  if(!currentMatchId)return;\n  try{\n    const clock=await call('toggleMatchClock',PIN,currentMatchId);\n    applyClockState_(clock);\n  }catch(e){}\n}''',
              '''async function toggleClock(){\n  if(!currentMatchId)return;\n  const wasRunning=!!clockRunningSince;\n  if(wasRunning){\n    clockBaseSeconds=currentElapsedSeconds();\n    clockRunningSince=null;\n    if(matchTimer){clearInterval(matchTimer);matchTimer=null}\n    const b=document.getElementById('clockBtn');\n    b.textContent='Resume';\n    b.className='btn green';\n    b.disabled=true;\n    renderClock();\n  }\n  try{\n    const clock=await call('toggleMatchClock',PIN,currentMatchId);\n    applyClockState_(clock);\n  }catch(e){\n    await syncSharedClock_();\n    toast('Could not update clock');\n  }\n}''',
              'optimistic pause')

          # Half Time button becomes End Game during second half.
          rep('''function setHalfTimeButton_(onBreak){\n  const htBtn=document.getElementById('htBtn');\n  if(onBreak){\n    htBtn.textContent='Start 2nd Half';\n    htBtn.className='btn green full';\n  }else{\n    htBtn.textContent='Half Time';\n    htBtn.className='btn secondary full';\n  }\n}''',
              '''function setHalfTimeButton_(onBreak){\n  const htBtn=document.getElementById('htBtn');\n  if(onBreak){\n    htBtn.textContent='Start 2nd Half';\n    htBtn.className='btn green full';\n    htBtn.onclick=toggleHalfTime;\n  }else if(matchHalf>=2){\n    htBtn.textContent='End Game';\n    htBtn.className='btn danger full';\n    htBtn.onclick=showFinishMatchConfirm;\n  }else{\n    htBtn.textContent='Half Time';\n    htBtn.className='btn secondary full';\n    htBtn.onclick=toggleHalfTime;\n  }\n}''',
              'end game button')

          # Scorer and assist may be the same.
          rep("  if(type==='Goal'&&draftEvent.secondaryPlayer&&draftEvent.secondaryPlayer===draftEvent.player)return toast('Scorer and assist cannot be the same');\n",'', 'same scorer assist frontend')

          # Delete individual event control + action.
          rep('''        <button class="btn secondary" style="padding:7px 11px" onclick="editEvent('${escJs(e.eventId)}')">Edit</button>''',
              '''        <div style="display:flex;gap:5px"><button class="btn secondary" style="padding:7px 11px" onclick="editEvent('${escJs(e.eventId)}')">Edit</button><button class="btn danger" style="padding:7px 11px" onclick="deleteEventById('${escJs(e.eventId)}')">Delete</button></div>''',
              'event delete button')
          rep('''async function refreshSummary(){currentSummary=await call('getMatchSummary',PIN,currentMatchId);renderSummary(currentSummary);applyClockState_(currentSummary.clock)}\nasync function undoLastEvent(){if(!confirm('Undo the most recent event?'))return;currentSummary=await call('deleteLastEvent',PIN,currentMatchId);renderSummary(currentSummary)}''',
              '''async function refreshSummary(){currentSummary=await call('getMatchSummary',PIN,currentMatchId);renderSummary(currentSummary);applyClockState_(currentSummary.clock)}\nasync function deleteEventById(eventId){\n  if(!eventId||!currentMatchId)return;\n  if(!confirm('Delete this event?'))return;\n  try{\n    currentSummary=await call('deleteEvent',PIN,eventId,currentMatchId);\n    renderSummary(currentSummary);\n    applyClockState_(currentSummary.clock);\n    toast('Event deleted');\n  }catch(e){toast(e&&e.message?e.message:'Could not delete event')}\n}\nasync function undoLastEvent(){if(!confirm('Undo the most recent event?'))return;currentSummary=await call('deleteLastEvent',PIN,currentMatchId);renderSummary(currentSummary)}''',
              'delete event function')

          # Completed state reveals Share Result only after finishing.
          rep('''  const liveControls=document.getElementById('liveMatchControls');\n\n  const completed=m.status==='Completed';''',
              '''  const liveControls=document.getElementById('liveMatchControls');\n  const shareBtn=document.getElementById('shareResultBtn');\n\n  const completed=m.status==='Completed';\n  if(shareBtn)shareBtn.classList.toggle('hidden',!completed);''',
              'share visibility')

          p.write_text(s)
      - name: Commit changes and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/mc2-punchlist.yml
          git add match2.html .github/workflows/mc2-punchlist.yml
          git commit -m "Fix MC2 matchday punch list"
          git push
