name: Player DOB onboarding migration
on:
  push:
    paths:
      - '.github/workflows/player-dob-onboarding.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch files
        run: python .github/scripts/player_dob_patch.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps-script/code.gs match.html player.html
          git commit -m "Add DOB first-time player portal onboarding"
          git push
