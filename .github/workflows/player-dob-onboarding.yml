name: Player DOB onboarding migration

on:
  push:
    paths:
      - '.github/workflows/player-dob-onboarding.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch player onboarding
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text, old, new, label):
              if new in text:
                  return text
              if old not in text:
                  raise SystemExit(f'Could not find {label}')
              return text.replace(old, new, 1)

          # ---------- Apps Script backend ----------
          p = Path('apps-script/code.gs')
          s = p.read_text()

          old = "    createPlayerSession: function(a) { return createPlayerSession(a[0], a[1]); },\n"
          new = old + "    createPlayerSetupSession: function(a) { return createPlayerSetupSession(a[0], a[1]); },\n"
          s = replace_once(s, old, new, 'player setup RPC handler')

          old = """function getPortalPlayers() {
  return getPlayers_()
    .filter(p => p.active !== false)
    .map(p => ({ name: p.name, alias: p.alias || '' }));
}
"""
          new = """function getPortalPlayers() {
  const sh = getSS_().getSheetByName(SHEETS.PLAYERS);
  if (!sh) throw new Error('Players sheet is missing.');
  const chosenCol = ensurePlayerPinChosenColumn_();
  const rows = sh.getDataRange().getValues().slice(1);
  return rows
    .filter(r => String(r[0] || '').trim() && bool_(r[1]))
    .map(r => ({
      name: String(r[0] || '').trim(),
      alias: String(r[6] || ''),
      pinChosen: bool_(r[chosenCol - 1])
    }))
    .sort((a,b) => a.name.localeCompare(b.name));
}
"""
          s = replace_once(s, old, new, 'getPortalPlayers')

          marker = "function createPlayerSession(playerName, pin) {"
          helper = r'''function ensurePlayerDobColumn_() {
  const sh = getSS_().getSheetByName(SHEETS.PLAYERS);
  if (!sh) throw new Error('Players sheet is missing.');
  const lastCol = Math.max(sh.getLastColumn(), 10);
  const headers = sh.getRange(1, 1, 1, lastCol).getValues()[0]
    .map(v => String(v || '').trim());
  let col = headers.findIndex(h => h === 'Date of Birth') + 1;
  if (!col) {
    col = 10; // J
    sh.getRange(1, col).setValue('Date of Birth');
    sh.getRange(2, col, Math.max(sh.getMaxRows() - 1, 1), 1).setNumberFormat('dd/mm/yyyy');
  }
  return col;
}

function normalisePlayerDob_(value) {
  if (value instanceof Date && !isNaN(value.getTime())) {
    return Utilities.formatDate(value, 'Europe/London', 'yyyy-MM-dd');
  }
  const s = String(value || '').trim();
  if (!s) return '';
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (m) return m[1] + '-' + m[2] + '-' + m[3];
  m = s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/);
  if (m) return m[3] + '-' + String(m[2]).padStart(2,'0') + '-' + String(m[1]).padStart(2,'0');
  return '';
}

function formatPlayerDob_(value) {
  return normalisePlayerDob_(value);
}

function setPlayerDob_(sh, row, value) {
  const col = ensurePlayerDobColumn_();
  const dob = normalisePlayerDob_(value);
  if (!dob) {
    sh.getRange(row, col).clearContent();
    return;
  }
  const d = new Date(dob + 'T12:00:00');
  sh.getRange(row, col).setValue(d).setNumberFormat('dd/mm/yyyy');
}

function createPlayerSetupSession(playerName, dateOfBirth) {
  playerName = String(playerName || '').trim();
  const suppliedDob = normalisePlayerDob_(dateOfBirth);
  if (!playerName || !suppliedDob) throw new Error('Select your name and enter your date of birth.');

  const sh = getSS_().getSheetByName(SHEETS.PLAYERS);
  if (!sh) throw new Error('Players sheet is missing.');
  const chosenCol = ensurePlayerPinChosenColumn_();
  const dobCol = ensurePlayerDobColumn_();
  const rows = sh.getDataRange().getValues().slice(1);
  const idx = rows.findIndex(r => String(r[0] || '').trim() === playerName && bool_(r[1]));
  if (idx < 0) throw new Error('Player not found.');

  const row = rows[idx];
  if (bool_(row[chosenCol - 1])) {
    throw new Error('You already have a PIN. Use the normal login above, or ask management to reset it.');
  }

  const savedDob = normalisePlayerDob_(row[dobCol - 1]);
  if (!savedDob) {
    throw new Error('Your date of birth has not been added yet. Ask management to update your player record.');
  }
  if (savedDob !== suppliedDob) {
    throw new Error('That date of birth does not match our records.');
  }

  const token = Utilities.getUuid() + Utilities.getUuid();
  const expiresAt = Date.now() + PLAYER_SESSION_HOURS * 60 * 60 * 1000;
  PropertiesService.getScriptProperties().setProperty(
    PLAYER_SESSION_PREFIX + token,
    JSON.stringify({ playerName, expiresAt })
  );

  return { token, playerName, expiresAt, pinChosen: false, mustChoosePin: true };
}

'''
          if 'function createPlayerSetupSession(' not in s:
              if marker not in s: raise SystemExit('Could not find player session insertion point')
              s = s.replace(marker, helper + marker, 1)

          # Add DOB to admin reads.
          old = """function getAllPlayersForAdmin(pin) {
  assertPin_(pin);
  const sh = getSS_().getSheetByName(SHEETS.PLAYERS);
  return sh.getDataRange().getValues().slice(1)
"""
          new = """function getAllPlayersForAdmin(pin) {
  assertPin_(pin);
  const sh = getSS_().getSheetByName(SHEETS.PLAYERS);
  ensurePlayerDobColumn_();
  return sh.getDataRange().getValues().slice(1)
"""
          s = replace_once(s, old, new, 'admin DOB read init')

          old = "      alias: String(r[6] || '')\n    }))"
          new = "      alias: String(r[6] || ''),\n      dateOfBirth: formatPlayerDob_(r[9])\n    }))"
          s = replace_once(s, old, new, 'admin DOB field')

          # New players: preserve H/I portal columns and write DOB to J.
          old = """  sh.appendRow([
    name,
    true,
    data.position || '',
    data.shirtNo || '',
    !!data.goalkeeper,
    data.notes || '',
    data.alias || ''
  ]);
"""
          new = """  ensurePlayerPinChosenColumn_();
  ensurePlayerDobColumn_();
  sh.appendRow([
    name,
    true,
    data.position || '',
    data.shirtNo || '',
    !!data.goalkeeper,
    data.notes || '',
    data.alias || '',
    '',
    false,
    ''
  ]);
  if (data.dateOfBirth) setPlayerDob_(sh, sh.getLastRow(), data.dateOfBirth);
"""
          s = replace_once(s, old, new, 'add player DOB')

          # Existing player edit: update J without touching PIN columns.
          old = """  sh.getRange(rowNumber, 1, 1, 7).setValues([[
    newName,
    data.active !== false,
    data.position || '',
    data.shirtNo || '',
    !!data.goalkeeper,
    data.notes || '',
    data.alias || ''
  ]]);

  if (typeof ensureSubsPlayerColumn_ === 'function') {
"""
          new = """  sh.getRange(rowNumber, 1, 1, 7).setValues([[
    newName,
    data.active !== false,
    data.position || '',
    data.shirtNo || '',
    !!data.goalkeeper,
    data.notes || '',
    data.alias || ''
  ]]);
  setPlayerDob_(sh, rowNumber, data.dateOfBirth || '');

  if (typeof ensureSubsPlayerColumn_ === 'function') {
"""
          s = replace_once(s, old, new, 'update player DOB')

          p.write_text(s)

          # ---------- Match Centre player admin UI ----------
          p = Path('match.html')
          s = p.read_text()

          old = '<input id="epAlias" placeholder="Voting alias (optional)"><br><br>\n        <textarea id="epNotes" placeholder="Notes"></textarea>'
          new = '<input id="epAlias" placeholder="Voting alias (optional)"><br><br>\n        <label class="muted" for="epDob">Date of birth</label>\n        <input id="epDob" type="date"><br><br>\n        <textarea id="epNotes" placeholder="Notes"></textarea>'
          s = replace_once(s, old, new, 'edit DOB field')

          old = '<input id="apAlias" placeholder="Voting alias (optional)"><br><br><textarea id="apNotes" placeholder="Notes"></textarea>'
          new = '<input id="apAlias" placeholder="Voting alias (optional)"><br><br><label class="muted" for="apDob">Date of birth</label><input id="apDob" type="date"><br><br><textarea id="apNotes" placeholder="Notes"></textarea>'
          s = replace_once(s, old, new, 'add DOB field')

          old = "  document.getElementById('epAlias').value=p.alias||'';\n  document.getElementById('epNotes').value=p.notes||'';"
          new = "  document.getElementById('epAlias').value=p.alias||'';\n  document.getElementById('epDob').value=p.dateOfBirth||'';\n  document.getElementById('epNotes').value=p.notes||'';"
          s = replace_once(s, old, new, 'edit DOB populate')

          old = "    alias:val('epAlias').trim(),\n    notes:val('epNotes')"
          new = "    alias:val('epAlias').trim(),\n    dateOfBirth:val('epDob'),\n    notes:val('epNotes')"
          s = replace_once(s, old, new, 'edit DOB save')

          old = "function showAddPlayer(){['apName','apShirt','apNotes','apAlias'].forEach(id=>document.getElementById(id).value='');document.getElementById('apPos').value='';document.getElementById('apGK').checked=false;showView('addPlayer')}"
          new = "function showAddPlayer(){['apName','apShirt','apNotes','apAlias','apDob'].forEach(id=>document.getElementById(id).value='');document.getElementById('apPos').value='';document.getElementById('apGK').checked=false;showView('addPlayer')}"
          s = replace_once(s, old, new, 'clear add DOB')

          old = "async function addPlayer(){const data={name:val('apName').trim(),position:val('apPos'),shirtNo:val('apShirt'),goalkeeper:document.getElementById('apGK').checked,notes:val('apNotes'),alias:val('apAlias')};"
          new = "async function addPlayer(){const data={name:val('apName').trim(),position:val('apPos'),shirtNo:val('apShirt'),goalkeeper:document.getElementById('apGK').checked,notes:val('apNotes'),alias:val('apAlias'),dateOfBirth:val('apDob')};"
          s = replace_once(s, old, new, 'add DOB save')

          p.write_text(s)

          # ---------- Player Portal first-time onboarding ----------
          p = Path('player.html')
          s = p.read_text()

          old = '<div id="login" class="card login"><h2>Player Portal</h2><div class="muted" style="margin-bottom:12px">Select your name and enter your personal PIN.</div><select id="player"><option value="">Select player…</option></select><input id="pin" type="password" inputmode="numeric" placeholder="PIN" style="margin-top:8px"><button id="loginBtn" class="btn full" style="margin-top:9px" onclick="login()">Log in</button></div>'
          new = '<div id="login" class="card login"><h2>Player Portal</h2><div class="muted" style="margin-bottom:12px">Select your name and enter your personal PIN.</div><select id="player"><option value="">Select player…</option></select><input id="pin" type="password" inputmode="numeric" placeholder="PIN" style="margin-top:8px"><button id="loginBtn" class="btn full" style="margin-top:9px" onclick="login()">Log in</button><button class="btn secondary full" style="margin-top:8px" onclick="showFirstTime()">First time here?</button></div>\n<div id="firstTime" class="card login hidden"><h2>First-time setup</h2><div class="muted" style="margin-bottom:12px">Select your name and confirm your date of birth. You’ll then choose your own 4-digit PIN.</div><select id="setupPlayer"><option value="">Select player…</option></select><input id="setupDob" type="date" style="margin-top:8px"><button id="setupBtn" class="btn full" style="margin-top:9px" onclick="firstTimeSetup()">Continue</button><button class="btn secondary full" style="margin-top:8px" onclick="showNormalLogin()">Back to login</button></div>'
          s = replace_once(s, old, new, 'first time UI')

          old = "try{const players=await pmdCall('getPortalPlayers');$('player').innerHTML='<option value=\"\">Select player…</option>'+players.map(x=>`<option>${esc(x.name)}</option>`).join('')}catch(e)"
          new = "try{const players=await pmdCall('getPortalPlayers');const opts='<option value=\"\">Select player…</option>'+players.map(x=>`<option>${esc(x.name)}</option>`).join('');$('player').innerHTML=opts;$('setupPlayer').innerHTML=opts}catch(e)"
          s = replace_once(s, old, new, 'populate setup player list')

          old = "async function login(){const n=$('player').value,p=$('pin').value.trim();"
          add = r'''function showFirstTime(){
 $('login').classList.add('hidden');$('firstTime').classList.remove('hidden');
 const current=$('player').value;if(current)$('setupPlayer').value=current;
}
function showNormalLogin(){
 $('firstTime').classList.add('hidden');$('login').classList.remove('hidden');
 const current=$('setupPlayer').value;if(current)$('player').value=current;
}
async function firstTimeSetup(){
 const n=$('setupPlayer').value,d=$('setupDob').value;
 if(!n||!d)return alert('Select your name and enter your date of birth.');
 const b=$('setupBtn');if(window.pmdSetButtonBusy)pmdSetButtonBusy(b,true,'Checking…');else{b.disabled=true;b.textContent='Checking…'}
 try{
  const session=await pmdCall('createPlayerSetupSession',n,d);
  TOKEN=session.token;save(session);await load();
 }catch(e){alert(e.message||'Could not start setup.')}
 finally{if(!$('firstTime').classList.contains('hidden')){if(window.pmdSetButtonBusy)pmdSetButtonBusy(b,false);else{b.disabled=false;b.textContent='Continue'}}}
}
'''
          if 'function firstTimeSetup()' not in s:
              if old not in s: raise SystemExit('Could not find login function insertion point')
              s = s.replace(old, add + old, 1)

          p.write_text(s)

          # Remove this one-off workflow after it has done its job.
          Path('.github/workflows/player-dob-onboarding.yml').unlink()

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add DOB first-time player portal onboarding"
          git push
