name: Cache bust management bridge

on:
  push:
    paths:
      - '.github/workflows/cache-bust-management-bridge.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update management pages
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ['subs.html','voting.html']:
              p=Path(name)
              s=p.read_text(encoding='utf-8')
              s=s.replace('./bridge-live.js"></script>', './bridge-live.js?v=20260915-2"></script>')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name 'PerranporthAFCMens'
          git config user.email 'shortcutsemail@gmail.com'
          git add subs.html voting.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Force latest management bridge on subs and voting'
          git push
