name: Fix spectator bridge
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-spectator-bridge.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch spectator transport
        run: python .github/scripts/fix_spectator_bridge.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps-script/code.gs live.html
          git commit -m "Use reliable iframe bridge for spectator board"
          git push
