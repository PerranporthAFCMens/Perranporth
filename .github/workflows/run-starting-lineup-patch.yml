name: Run starting lineup patch
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/run-starting-lineup-patch.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/add_starting_lineup.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps-script/code.gs match.html
          git commit -m "Add Set as Starting Lineup action"
          git push
