name: Trigger player DOB migration
on:
  push:
    paths:
      - '.github/workflows/trigger-player-dob.yml'
permissions:
  actions: write
jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch migration
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run player-dob-onboarding.yml --repo "${{ github.repository }}"
