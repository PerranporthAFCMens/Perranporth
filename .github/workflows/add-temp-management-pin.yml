name: Add temporary management PIN support

on:
  push:
    paths:
      - '.github/workflows/add-temp-management-pin.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Apps Script backend
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps-script/code.gs')
          s = p.read_text(encoding='utf-8')

          old_verify = """  const settings = getSettings_();\n  if (value === String(settings['App PIN'] || '')) return true;\n"""
          new_verify = """  const settings = getSettings_();\n  if (value === String(settings['App PIN'] || '')) return true;\n  const temporaryPin = String(settings['Temporary Management PIN'] || '').trim();\n  if (temporaryPin && value === temporaryPin) return true;\n"""
          if "Temporary Management PIN" not in s:
              if old_verify not in s:
                  raise SystemExit('verifyPin target not found')
              s = s.replace(old_verify, new_verify, 1)

          old_create = """function createAdminSession(pin) {\n  const settings = getSettings_();\n  if (String(pin || '') !== String(settings['App PIN'] || '')) {\n    throw new Error('Incorrect PIN.');\n  }\n\n  const token = Utilities.getUuid() + '-' + Utilities.getUuid();\n  const expiresAt = Date.now() + (ADMIN_SESSION_HOURS * 60 * 60 * 1000);\n\n  PropertiesService.getScriptProperties()\n    .setProperty(ADMIN_SESSION_PREFIX + token, String(expiresAt));\n\n  return { token: token, expiresAt: expiresAt };\n}\n"""
          new_create = """function createAdminSession(pin) {\n  const settings = getSettings_();\n  const enteredPin = String(pin || '').trim();\n  const appPin = String(settings['App PIN'] || '').trim();\n  const temporaryPin = String(settings['Temporary Management PIN'] || '').trim();\n  const isMainPin = enteredPin && enteredPin === appPin;\n  const isTemporaryPin = enteredPin && temporaryPin && enteredPin === temporaryPin;\n\n  if (!isMainPin && !isTemporaryPin) {\n    throw new Error('Incorrect PIN.');\n  }\n\n  const token = Utilities.getUuid() + '-' + Utilities.getUuid();\n  const expiresAt = Date.now() + (ADMIN_SESSION_HOURS * 60 * 60 * 1000);\n  const storedValue = isTemporaryPin\n    ? String(expiresAt) + '|TEMP|' + temporaryPin\n    : String(expiresAt);\n\n  PropertiesService.getScriptProperties()\n    .setProperty(ADMIN_SESSION_PREFIX + token, storedValue);\n\n  return { token: token, expiresAt: expiresAt };\n}\n"""
          if old_create in s:
              s = s.replace(old_create, new_create, 1)
          elif "const isTemporaryPin" not in s:
              raise SystemExit('createAdminSession target not found')

          old_valid = """  const expiresAt = Number(raw);\n  if (!expiresAt || Date.now() >= expiresAt) {\n    props.deleteProperty(key);\n    return false;\n  }\n  return true;\n"""
          new_valid = """  const parts = String(raw).split('|');\n  const expiresAt = Number(parts[0]);\n  if (!expiresAt || Date.now() >= expiresAt) {\n    props.deleteProperty(key);\n    return false;\n  }\n\n  if (parts[1] === 'TEMP') {\n    const settings = getSettings_();\n    const currentTemporaryPin = String(settings['Temporary Management PIN'] || '').trim();\n    if (!currentTemporaryPin || parts[2] !== currentTemporaryPin) {\n      props.deleteProperty(key);\n      return false;\n    }\n  }\n\n  return true;\n"""
          if old_valid in s:
              s = s.replace(old_valid, new_valid, 1)
          elif "currentTemporaryPin" not in s:
              raise SystemExit('isValidAdminSession target not found')

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit backend change
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'PerranporthAFCMens'
          git config user.email 'shortcutsemail@gmail.com'
          git add apps-script/code.gs
          git commit -m 'Support temporary management PIN'
          git push
