name: Run trial resume patch
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/run-fix-trial-resume.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/fix_trial_resume.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add match.html
          git commit -m "Restore live trial match after refresh"
          git push
