name: Promote MC2 frontend to live staging

on:
  push:
    paths:
      - '.github/workflows/promote-match2-to-live.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build live Match Centre from tested MC2
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          s = Path('match2.html').read_text()

          # Remove the MC2 environment banner only.
          s = re.sub(
              r'<div style="position:sticky;top:0;z-index:5000;background:#7c2d12;color:#fff;padding:9px 12px;text-align:center;font-weight:900;letter-spacing:\.3px;box-shadow:0 2px 8px #0003">\s*MATCH CENTRE 2 — TEST ENVIRONMENT — NOT LIVE DATA\s*</div>\s*',
              '', s, count=1
          )

          replacements = {
              '<title>Match Centre 2 — TEST</title>': '<title>Match Centre</title>',
              '<script src="./bridge-mc2.js"></script>': '<script src="./bridge-live.js"></script>',
              '<h1>Match Centre 2</h1>': '<h1>Match Centre</h1>',
              'Perranporth AFC — MC2': 'Perranporth AFC',
              './match2.html': './match.html',
              'pmd_admin_auth_mc2': 'pmd_admin_auth',
              'pmd_session_mc2': 'pmd_session',
              'Ghost Mode unavailable in MC2': 'Ghost Mode is available from the Control Centre',
              'MC2 is isolated from the live Player Portal. Use the normal Ghost Mode from the Control Centre.': 'Use Ghost Mode from the Control Centre.',
          }
          for a,b in replacements.items():
              s = s.replace(a,b)

          Path('match.html').write_text(s)
          PY

      - name: Commit staged live frontend
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add match.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Stage tested MC2 as live Match Centre frontend"
            git push
          fi
