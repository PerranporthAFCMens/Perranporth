name: Fix spectator trial visibility
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-spectator-trial.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch spectator live-match lookup
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('apps-script/code.gs')
          s=p.read_text()
          old="const liveMatches = getMatches_(true).filter(m => String(m.status || '').toLowerCase() === 'live');"
          new="const matchRows = getSS_().getSheetByName(SHEETS.MATCHES).getDataRange().getValues().slice(1);\n  const liveMatches = matchRows.map(rowToMatch_).filter(m => m.matchId && String(m.status || '').toLowerCase() === 'live');"
          if old not in s:
              raise SystemExit('Spectator live-match lookup not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps-script/code.gs
          git commit -m "Allow spectator board to see live trial matches"
          git push
