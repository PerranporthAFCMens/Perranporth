name: Update GitHub username references
on:
  push:
    paths:
      - '.github/workflows/update-github-username.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace old GitHub username
        shell: bash
        run: |
          grep -RIl --exclude-dir=.git 'ajtbenanbar' . | while read -r f; do
            sed -i 's/ajtbenanbar/PerranporthAFCMens/g' "$f"
          done
          rm -f .github/workflows/update-github-username.yml
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update GitHub username references"
          git push
