name: Add spectator live API
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-spectator-api.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch backend and live board
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('apps-script/code.gs')
          s=p.read_text()
          old="""    } else if (api === 'dashboardHistoric') {\n      envelope = { ok: true, result: getHistoricalDashboardData() };\n    } else if (api === 'rpc') {"""
          new="""    } else if (api === 'dashboardHistoric') {\n      envelope = { ok: true, result: getHistoricalDashboardData() };\n    } else if (api === 'spectator') {\n      envelope = { ok: true, result: getPublicSpectatorData() };\n    } else if (api === 'rpc') {"""
          if old not in s:
              raise SystemExit('Public API insertion point not found')
          s=s.replace(old,new,1)

          anchor="""function openSubsWithPin_(pin) {"""
          spectator=r'''function getPublicSpectatorData() {
  const liveMatches = getMatches_(true).filter(m => String(m.status || '').toLowerCase() === 'live');
  if (!liveMatches.length) {
    return {
      live: false,
      generatedAt: Utilities.formatDate(new Date(), 'Europe/London', 'dd/MM/yyyy HH:mm:ss')
    };
  }

  const match = liveMatches[liveMatches.length - 1];
  const events = getEvents_(match.matchId).slice().sort((a,b) => Number(a.minute || 0) - Number(b.minute || 0));
  const score = calculateScore_(events);
  const clock = getMatchClock_(match.matchId);
  const squad = matchEventSquad_(match.matchId);
  const onPitch = Array.from(onPitchSet_(match.matchId, events));
  const onSet = new Set(onPitch);
  const redSet = new Set(events.filter(e => e.type === 'Red Card' && e.player).map(e => e.player));
  const lineup = getLineup_(match.matchId) || {};
  const positions = Array.isArray(lineup.positions) ? lineup.positions : [];
  const posByPlayer = {};
  positions.forEach(p => { if (p && p.player) posByPlayer[p.player] = p; });

  const allPlayers = squad.map(p => p.player).filter(Boolean);
  const available = allPlayers.filter(p => !onSet.has(p) && !redSet.has(p));
  const dismissed = allPlayers.filter(p => redSet.has(p));

  const publicEvents = events.map(e => ({
    minute: Number(e.minute || 0),
    type: String(e.type || ''),
    team: String(e.team || ''),
    player: String(e.player || ''),
    secondaryPlayer: String(e.secondaryPlayer || ''),
    goalType: String(e.goalType || ''),
    cardReason: String(e.cardReason || '')
  }));

  const home = String(match.venue || '').toLowerCase() !== 'away';
  return {
    live: true,
    match: {
      matchId: match.matchId,
      date: match.date,
      kickoff: match.kickoff,
      opponent: match.opponent,
      venue: match.venue,
      competition: match.competition,
      formation: (lineup && lineup.formation) || match.formation || ''
    },
    homeTeam: home ? 'Perranporth' : match.opponent,
    awayTeam: home ? match.opponent : 'Perranporth',
    homeScore: home ? Number(score.ours || 0) : Number(score.opp || 0),
    awayScore: home ? Number(score.opp || 0) : Number(score.ours || 0),
    clock: clock,
    onPitch: onPitch.map(name => ({
      name: name,
      x: posByPlayer[name] ? Number(posByPlayer[name].x || 0) : 0,
      y: posByPlayer[name] ? Number(posByPlayer[name].y || 0) : 0,
      order: posByPlayer[name] ? Number(posByPlayer[name].order || 0) : 0
    })),
    available: available,
    dismissed: dismissed,
    events: publicEvents,
    generatedAt: Utilities.formatDate(new Date(), 'Europe/London', 'dd/MM/yyyy HH:mm:ss')
  };
}

'''
          if anchor not in s:
              raise SystemExit('Spectator function insertion point not found')
          s=s.replace(anchor,spectator+anchor,1)
          p.write_text(s)

          p=Path('live.html')
          s=p.read_text()
          marker="""  const demo = new URLSearchParams(location.search).get('demo') === '1';\n"""
          insert="""  const demo = new URLSearchParams(location.search).get('demo') === '1';\n  const APP_URL='https://script.google.com/macros/s/AKfycbyHHPOgGsImS9Kvr3SdZiKUGp3ZrbnOoJnIPUckm_Y9hH1K9b_j_Kgmw6UhzVMAyQ0q/exec';\n"""
          if marker not in s:
              raise SystemExit('live marker not found')
          s=s.replace(marker,insert,1)

          tail="""  } else {\n    $('statusPill').textContent='NO LIVE MATCH'; $('statusPill').className='livepill none';\n    $('minute').textContent='No live match at the moment';\n  }\n  render();\n})();"""
          livecode=r'''  } else {
    function liveEventView(e){
      const m=Number(e.minute||0);
      if(e.type==='Goal' && String(e.team||'')!=='Opposition') return {m,i:'⚽',t:'GOAL! '+(e.player||'Perranporth'),s:e.secondaryPlayer?'Assist: '+e.secondaryPlayer:''};
      if(e.type==='Conceded Goal' || (e.type==='Goal' && String(e.team||'')==='Opposition')) return {m,i:'⚽',t:'Goal — '+state.away,s:''};
      if(e.type==='Substitution') return {m,i:'🔄',t:'Interchange',s:(e.secondaryPlayer||'Player')+' on • '+(e.player||'Player')+' off'};
      if(e.type==='Yellow Card') return {m,i:'🟨',t:(e.player||'Player')+' booked',s:e.cardReason||''};
      if(e.type==='Red Card') return {m,i:'🟥',t:(e.player||'Player')+' sent off',s:e.cardReason||''};
      return null;
    }

    function applyLiveData(d){
      if(!d || !d.live){
        state.status='NONE'; state.minute=0; state.home='Perranporth'; state.away=''; state.competition=''; state.homeScore=0; state.awayScore=0;
        state.allPlayers=[]; state.onPitch=[]; state.everReturned=[]; state.homeGoals=[]; state.awayGoals=[]; state.events=[];
        render();
        $('statusPill').textContent='NO LIVE MATCH'; $('statusPill').className='livepill none';
        $('minute').textContent='No live match at the moment';
        $('onPitch').innerHTML='<div class="empty">Lineup will appear when the match goes live.</div>';
        $('bench').innerHTML='';
        $('events').innerHTML='<div class="empty">No live updates yet.</div>';
        return;
      }

      const c=d.clock||{};
      state.status=c.finishedAt?'FT':c.onBreak?'HT':'LIVE';
      state.minute=Math.max(0,Math.floor(Number(c.elapsedSeconds||0)/60));
      state.home=d.homeTeam||'Perranporth'; state.away=d.awayTeam||''; state.competition=(d.match&&d.match.competition)||'';
      state.homeScore=Number(d.homeScore||0); state.awayScore=Number(d.awayScore||0);
      state.onPitch=(d.onPitch||[]).map(p=>typeof p==='string'?p:p.name).filter(Boolean);
      state.allPlayers=state.onPitch.concat((d.available||[]),(d.dismissed||[])).filter((v,i,a)=>a.indexOf(v)===i);

      const interchangeEvents=(d.events||[]).filter(e=>e.type==='Substitution');
      const returned=new Set();
      const appearances={};
      interchangeEvents.forEach(e=>{
        if(e.player) appearances[e.player]=(appearances[e.player]||0)+1;
        if(e.secondaryPlayer){
          appearances[e.secondaryPlayer]=(appearances[e.secondaryPlayer]||0)+1;
          if((appearances[e.secondaryPlayer]||0)>1) returned.add(e.secondaryPlayer);
        }
      });
      state.everReturned=Array.from(returned);

      const perranHome=state.home==='Perranporth';
      state.homeGoals=[]; state.awayGoals=[];
      (d.events||[]).forEach(e=>{
        const isOurs=e.type==='Goal' && String(e.team||'')!=='Opposition';
        const isOpp=e.type==='Conceded Goal' || (e.type==='Goal' && String(e.team||'')==='Opposition');
        if(isOurs){(perranHome?state.homeGoals:state.awayGoals).push({m:Number(e.minute||0),p:e.player||'Perranporth'});}
        if(isOpp){(perranHome?state.awayGoals:state.homeGoals).push({m:Number(e.minute||0),p:d.match&&d.match.opponent?d.match.opponent:'Opposition'});}
      });
      state.events=(d.events||[]).slice().reverse().map(liveEventView).filter(Boolean);
      render();
    }

    function loadLive(){
      const cb='spectatorCb_'+Date.now()+'_'+Math.random().toString(36).slice(2);
      const script=document.createElement('script');
      let done=false;
      const cleanup=()=>{if(script.parentNode)script.parentNode.removeChild(script);try{delete window[cb]}catch(e){window[cb]=undefined}};
      window[cb]=payload=>{done=true;cleanup();if(payload&&payload.ok)applyLiveData(payload.result);};
      script.onerror=()=>{cleanup();};
      script.src=APP_URL+'?api=spectator&callback='+encodeURIComponent(cb)+'&_='+Date.now();
      document.body.appendChild(script);
      setTimeout(()=>{if(!done)cleanup();},12000);
    }

    $('statusPill').textContent='LOADING'; $('statusPill').className='livepill none';
    $('minute').textContent='Checking for a live match…';
    loadLive();
    setInterval(loadLive,15000);
  }
  if(demo) render();
})();'''
          if tail not in s:
              raise SystemExit('live tail not found')
          s=s.replace(tail,livecode,1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps-script/code.gs live.html
          git commit -m "Wire spectator board to live match data"
          git push
