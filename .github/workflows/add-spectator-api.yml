name: Add spectator live API
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-spectator-api.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch backend and live board
        run: python .github/scripts/spectator_patch.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps-script/code.gs live.html
          git commit -m "Wire spectator board to live match data"
          git push
