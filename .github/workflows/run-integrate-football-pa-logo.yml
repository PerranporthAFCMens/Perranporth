name: Run Football PA logo integration
on:
  push:
    paths:
      - '.github/scripts/integrate_football_pa_logo.py'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/integrate_football_pa_logo.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add football-pa.html football-pa-logo.svg
          git commit -m "Integrate Football PA logo into landing page" || exit 0
          git push
