name: Add resume live match
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/run-add-resume-live-match.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/add_resume_live_match.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add match.html
          git commit -m "Add Resume Live Match action"
          git push
