name: Fix Subs and Voting bridge

on:
  push:
    paths:
      - '.github/workflows/fix-subs-voting-bridge.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Switch Subs and Voting to reliable bridge
        run: |
          python - <<'PY'
          from pathlib import Path
          changed = []
          for name in ['subs.html','voting.html']:
              p = Path(name)
              s = p.read_text(encoding='utf-8')
              ns = s.replace('./bridge-client.js','./bridge-live.js')
              if ns != s:
                  p.write_text(ns, encoding='utf-8')
                  changed.append(name)
          if not changed:
              raise SystemExit('No bridge references changed')
          print('Updated:', ', '.join(changed))
          PY
      - name: Commit bridge fix
        run: |
          git config user.name 'PerranporthAFCMens'
          git config user.email 'shortcutsemail@gmail.com'
          git add subs.html voting.html
          git commit -m 'Use reliable bridge for subs and voting'
          git push
