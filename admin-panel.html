<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b5ea8">
  <title>Perranporth Admin Panel</title>
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
  <link rel="icon" type="image/png" href="./apple-touch-icon.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <script src="./bridge-live.js?v=20260920-sessionfix3"></script>
  <script src="./button-feedback.js" defer></script>
  <style>
    :root{--blue:#0b5ea8;--dark:#123b5d;--danger:#c62828;--green:#23811c;--bg:#f3f6f8;--line:#d8e0e6;--text:#17212b;--muted:#71808e}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text);-webkit-text-size-adjust:100%}
    .app{width:100%;max-width:820px;margin:0 auto;padding:max(10px,env(safe-area-inset-top)) 10px max(24px,env(safe-area-inset-bottom))}
    .card{background:#fff;border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:0 1px 5px #00000010;border:1px solid #e9eef2}
    .hero{display:flex;align-items:center;gap:12px}.badge{width:54px;height:54px;border-radius:50%;object-fit:contain;background:#fff}.heroActions{margin-left:auto;display:flex;gap:6px}
    h1{font-size:22px;margin:0;color:var(--dark)}h2{font-size:18px;margin:0 0 12px}.muted{color:var(--muted);font-size:13px}.hidden{display:none!important}
    input,select{width:100%;min-height:46px;padding:11px 12px;border:1px solid var(--line);border-radius:11px;font-size:16px;background:#fff;color:var(--text)}
    label{display:block;font-size:13px;font-weight:700;margin:10px 0 5px}.btn{border:0;border-radius:11px;min-height:46px;padding:10px 13px;font-size:14px;font-weight:700;background:var(--blue);color:#fff;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.btn.secondary{background:#e7edf2;color:#263746}.btn.danger{background:var(--danger)}.btn.green{background:var(--green)}.btn.full{width:100%}
    .pinWrap{min-height:70vh;display:flex;align-items:center;justify-content:center}.pinCard{width:100%;max-width:380px;text-align:center}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.person{border:1px solid #dfe7ed;border-radius:13px;padding:12px;margin:9px 0}.personHead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.pill{display:inline-block;border-radius:999px;padding:4px 8px;font-size:12px;font-weight:800;background:#eaf2fb;color:#135b99}
    .actions{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:10px}.checkRow{display:flex;align-items:center;gap:9px;margin-top:12px}.checkRow input{width:22px;min-height:22px}.checkRow label{margin:0;font-weight:700}
    .accessBox{background:#f6f8fa;border:1px solid #e2e8ed;border-radius:13px;padding:11px;margin-top:12px}.accessHead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px}.accessGrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.accessItem{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #e3e9ee;border-radius:10px;padding:9px 10px;font-size:13px;font-weight:700;margin:0}.accessItem input{width:19px;min-height:19px;margin:0}.accessPills{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}.accessPill{background:#f0f5fa;border-radius:999px;padding:5px 8px;font-size:11px;font-weight:700;color:#345}
    .auditFilters{display:grid;grid-template-columns:1fr 1fr 1fr 1fr auto;gap:7px;align-items:end;margin-bottom:10px}.auditFilters label{margin-top:0}.auditTableWrap{overflow:auto;border:1px solid var(--line);border-radius:11px}.auditTable{width:100%;border-collapse:collapse;min-width:760px}.auditTable th,.auditTable td{padding:9px 8px;border-bottom:1px solid #edf1f4;text-align:left;font-size:12px;vertical-align:top}.auditTable th{background:#f6f8fa;position:sticky;top:0;z-index:1}.auditOk{color:#23811c;font-weight:700}.auditFail{color:#c62828;font-weight:700}.auditEmpty{padding:18px;text-align:center;color:var(--muted);font-size:13px}
    .toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#17212b;color:#fff;padding:11px 16px;border-radius:20px;display:none;z-index:1000;max-width:90%;text-align:center}
    @media(max-width:600px){.app{padding:max(7px,env(safe-area-inset-top)) 7px max(18px,env(safe-area-inset-bottom))}.row,.actions,.accessGrid,.auditFilters{grid-template-columns:1fr}.badge{width:46px;height:46px}h1{font-size:20px}.personHead{align-items:center}}
  </style>
</head>
<body onload="boot()">
<div class="app">
  <div id="loginWrap" class="pinWrap hidden"><div class="card pinCard"><h1>Admin Panel</h1><div class="muted" style="margin:8px 0 16px">Admin Panel access required</div><input id="pinInput" type="password" inputmode="numeric" placeholder="Enter management PIN"><button id="loginBtn" class="btn full" style="margin-top:10px" onclick="login()">Open Admin Panel</button></div></div>
  <div id="adminApp" class="hidden">
    <div class="card hero"><img id="badge" class="badge" src="./apple-touch-icon.png" alt="Perranporth AFC"><div><h1>Admin Panel</h1><div class="muted">Management access & PIN control</div></div><div class="heroActions"><a class="btn secondary" href="./">Home</a><button class="btn secondary" onclick="logout()">Log out</button></div></div>
    <div class="card"><h2 id="formTitle">Grant management access</h2><input id="userId" type="hidden"><div class="row"><div><label>Name</label><input id="name" placeholder="Name"></div><div><label>Email</label><input id="email" type="email" placeholder="name@example.com"></div></div><div class="row"><div><label>Quick access preset</label><select id="role" onchange="applyPreset()"><option value="FULL_ADMIN">Full Admin</option><option value="MATCHDAY">Matchday Manager</option><option value="COACH_ANALYST">Coach / Analyst</option><option value="TREASURER">Treasurer</option><option value="VOTING">Voting only</option><option value="SUBS">Subs only</option><option value="READ_ONLY">Read only</option><option value="CUSTOM">Custom</option></select></div><div><label>Linked player</label><select id="linkedPlayer"><option value="">None</option></select></div></div><div class="checkRow"><input id="playerAccessToo" type="checkbox"><label for="playerAccessToo">Player access too — use the same PIN for management and Player Portal</label></div><div class="accessBox"><div class="accessHead"><div><b>Control Centre tile access</b><div class="muted">Tick exactly what this person can use.</div></div><button class="btn secondary" type="button" style="min-height:34px;padding:6px 9px" onclick="clearAccess()">Clear</button></div><div id="accessGrid" class="accessGrid"></div></div><div class="actions"><button class="btn green" onclick="saveUser()">Save Access</button><button class="btn secondary" onclick="clearForm()">Clear Form</button></div></div>
    <div class="card"><h2>Management users</h2><div id="users"><div class="muted">Loading…</div></div></div>
    <div class="card"><div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px"><div><h2 style="margin-bottom:3px">Activity Log</h2><div class="muted">Management logins, page access and important changes.</div></div><button class="btn secondary" style="min-height:36px" onclick="loadAudit()">Refresh</button></div><div class="auditFilters"><div><label>User</label><select id="auditUser" onchange="loadAudit()"><option value="">All users</option></select></div><div><label>Area</label><select id="auditArea" onchange="loadAudit()"><option value="">All areas</option></select></div><div><label>Date</label><input id="auditDate" type="date" onchange="loadAudit()"></div><div><label>Action contains</label><input id="auditAction" placeholder="e.g. Login" onkeydown="if(event.key==='Enter')loadAudit()"></div><button class="btn secondary" onclick="clearAuditFilters()">Clear</button></div><div id="auditRows"><div class="muted">Loading activity…</div></div></div>
  </div>
</div><div id="toast" class="toast"></div>
<script>
const AUTH_KEY='pmd_admin_auth';
const DEFAULT_ITEMS=[{key:'match',label:'Match Centre',icon:'⚽'},{key:'voting',label:'Voting Centre',icon:'🗳️'},{key:'subs',label:'Subs Tracker',icon:'💷'},{key:'dashboard',label:'Season Dashboard',icon:'📊'},{key:'minutes',label:'Player Minutes',icon:'⏱️'},{key:'ghost',label:'Ghost Mode',icon:'👻'},{key:'player_pins',label:'Player PINs',icon:'🔐'},{key:'admin',label:'Admin Panel',icon:'🛡️'}];
const PRESETS={FULL_ADMIN:['match','voting','subs','dashboard','minutes','ghost','player_pins','admin'],MATCHDAY:['match','voting','dashboard','minutes'],COACH_ANALYST:['dashboard','minutes','ghost'],TREASURER:['subs'],VOTING:['voting'],SUBS:['subs'],READ_ONLY:['dashboard','minutes'],CUSTOM:[]};
let TOKEN='',DATA=null,EDITING=false;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',3000)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function readSaved(){try{const raw=localStorage.getItem(AUTH_KEY)||'';if(!raw)return null;try{const obj=JSON.parse(raw);if(obj&&obj.token)return obj}catch(e){}return {token:raw,expiresAt:Date.now()+86400000}}catch(e){return null}}
function saveSession(s){try{localStorage.setItem(AUTH_KEY,JSON.stringify(s))}catch(e){}}
function clearSession(){try{localStorage.removeItem(AUTH_KEY)}catch(e){}}
function returnTarget_(){
  const raw=new URLSearchParams(location.search).get('return')||'';
  const allowed=new Set(['match.html','voting.html','subs.html','pins.html','minutes.html','dashboard.html']);
  return allowed.has(raw)?raw:'';
}
function goReturn_(){const t=returnTarget_();if(t)location.replace('./'+t+'?fromAdmin=1')}
async function boot(){
  renderAccessGrid();
  const s=readSaved();
  if(s&&s.token&&(!s.expiresAt||s.expiresAt>Date.now())){
    TOKEN=s.token;
    try{
      if(await pmdCall('verifyPin',TOKEN)){
        return await load();
      }
    }catch(e){}
    clearSession();TOKEN='';
  }
  showLogin();
}
function showLogin(){document.getElementById('adminApp').classList.add('hidden');document.getElementById('loginWrap').classList.remove('hidden')}
async function login(){
  const pin=document.getElementById('pinInput').value.trim();
  if(!pin)return toast('Enter PIN');
  const b=document.getElementById('loginBtn');b.disabled=true;b.textContent='Opening…';
  try{
    const s=await pmdCall('createAdminSession',pin);
    TOKEN=s.token;saveSession(s);
    await load();
  }catch(e){
    TOKEN='';toast(e.message||'Access denied');b.disabled=false;b.textContent='Open Admin Panel';
  }
}
async function logout(){const t=TOKEN;TOKEN='';clearSession();try{if(t)await pmdCall('logoutAdminSession',t)}catch(e){}showLogin()}
async function load(){DATA=await pmdCall('getManagementAdminData',TOKEN);document.getElementById('loginWrap').classList.add('hidden');document.getElementById('adminApp').classList.remove('hidden');renderAccessGrid();renderPlayers();renderUsers();await loadAudit()}
function items(){return (DATA&&DATA.accessItems&&DATA.accessItems.length)?DATA.accessItems:DEFAULT_ITEMS}
function renderAccessGrid(){const current=getSelectedAccess();document.getElementById('accessGrid').innerHTML=items().map(x=>`<label class="accessItem"><input class="accessCheck" type="checkbox" value="${esc(x.key)}" onchange="accessChanged()"> <span>${esc(x.icon||'')} ${esc(x.label)}</span></label>`).join('');if(current.length)setSelectedAccess(current)}
function getSelectedAccess(){return [...document.querySelectorAll('.accessCheck:checked')].map(x=>x.value)}
function setSelectedAccess(list){const set=new Set(list||[]);document.querySelectorAll('.accessCheck').forEach(x=>x.checked=set.has(x.value))}
function clearAccess(){setSelectedAccess([]);document.getElementById('role').value='CUSTOM'}
function accessChanged(){if(!EDITING_PRESET)document.getElementById('role').value='CUSTOM'}
let EDITING_PRESET=false;
function applyPreset(){EDITING_PRESET=true;const role=document.getElementById('role').value;setSelectedAccess(PRESETS[role]||[]);EDITING_PRESET=false}
function renderPlayers(){const s=document.getElementById('linkedPlayer');const current=s.value;s.innerHTML='<option value="">None</option>'+(DATA.players||[]).map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join('');if(current)s.value=current}
function roleLabel(r){return({FULL_ADMIN:'Full Admin',MATCHDAY:'Matchday Manager',COACH_ANALYST:'Coach / Analyst',TREASURER:'Treasurer',VOTING:'Voting only',SUBS:'Subs only',READ_ONLY:'Read only',CUSTOM:'Custom'})[r]||r}
function userAccess(u){if((u.accessItems||[]).length)return u.accessItems;const perms=(u.permissions||[]);if(perms.includes('*'))return items();const effective=(u.customAccess&&u.customAccess.length)?u.customAccess:(PRESETS[u.role]||[]);return items().filter(x=>effective.includes(x.key))}
function renderUsers(){const h=document.getElementById('users'),a=DATA.users||[];h.innerHTML=a.length?a.map(u=>{const access=userAccess(u);return `<div class="person"><div class="personHead"><div><b>${esc(u.name)}</b><div class="muted">${esc(u.email||'No email')} ${u.linkedPlayer?`· Player: ${esc(u.linkedPlayer)}`:''}</div></div><span class="pill">${esc(roleLabel(u.role))}</span></div><div class="accessPills">${access.length?access.map(x=>`<span class="accessPill">${esc(x.icon||'')} ${esc(x.label)}</span>`).join(''):'<span class="muted">No tiles assigned</span>'}</div><div class="muted" style="margin-top:8px">Player access too: <b>${u.playerAccessToo?'Yes':'No'}</b> · PIN set: <b>${u.hasPin?'Yes':'No'}</b></div><div class="actions"><button class="btn secondary" onclick="editUser('${esc(u.id)}')">Edit Access</button><button class="btn green" onclick="setUserPin('${esc(u.id)}')">Set / Reset PIN</button><button class="btn secondary" onclick="revokeSessions('${esc(u.id)}')">Sign Out Everywhere</button><button class="btn danger" onclick="removeUser('${esc(u.id)}')">Remove Access</button></div></div>`}).join(''):'<div class="muted">No individual management users yet. Your main management PIN still works as normal.</div>'}
function clearForm(){EDITING=false;document.getElementById('formTitle').textContent='Grant management access';['userId','name','email'].forEach(id=>document.getElementById(id).value='');document.getElementById('role').value='MATCHDAY';document.getElementById('linkedPlayer').value='';document.getElementById('playerAccessToo').checked=false;applyPreset()}
function editUser(id){const u=(DATA.users||[]).find(x=>x.id===id);if(!u)return;EDITING=true;document.getElementById('formTitle').textContent='Edit '+u.name;document.getElementById('userId').value=u.id;document.getElementById('name').value=u.name;document.getElementById('email').value=u.email||'';document.getElementById('role').value=u.role in PRESETS?u.role:'CUSTOM';document.getElementById('linkedPlayer').value=u.linkedPlayer||'';document.getElementById('playerAccessToo').checked=!!u.playerAccessToo;const access=(u.customAccess&&u.customAccess.length)?u.customAccess:((u.permissions||[]).includes('*')?PRESETS.FULL_ADMIN:(PRESETS[u.role]||[]));setSelectedAccess(access);window.scrollTo({top:0,behavior:'smooth'})}
async function saveUser(){const d={id:document.getElementById('userId').value.trim(),name:document.getElementById('name').value.trim(),email:document.getElementById('email').value.trim(),role:document.getElementById('role').value,linkedPlayer:document.getElementById('linkedPlayer').value,playerAccessToo:document.getElementById('playerAccessToo').checked,customAccess:getSelectedAccess()};if(!d.name)return toast('Enter a name');if(!d.customAccess.length&&d.role!=='FULL_ADMIN')return toast('Choose at least one Control Centre tile');try{await pmdCall('saveManagementUser',TOKEN,d);toast('Access saved');clearForm();await load()}catch(e){toast(e.message||'Could not save access')}}
async function setUserPin(id){
  const u=(DATA.users||[]).find(x=>x.id===id);if(!u)return;
  const label=u.playerAccessToo?'Enter a 4-digit PIN. This will also become the linked player\'s Player Portal PIN.':'Enter a 4 to 8 digit management PIN.';
  const pin=prompt(label,'');
  if(pin===null)return;
  const value=String(pin).trim();
  if(u.playerAccessToo?!/^\d{4}$/.test(value):!/^\d{4,8}$/.test(value))return toast(u.playerAccessToo?'PIN must be exactly 4 digits':'PIN must be 4 to 8 digits');
  try{await pmdCall('setManagementPin',TOKEN,id,value);toast('PIN updated');await load()}catch(e){toast(e.message||'Could not update PIN')}
}
async function revokeSessions(id){if(!confirm('Sign this user out on all management devices?'))return;try{await pmdCall('revokeManagementSessions',TOKEN,id);toast('Sessions revoked')}catch(e){toast(e.message||'Could not revoke sessions')}}
async function removeUser(id){if(!confirm('Remove this person’s management access?'))return;try{await pmdCall('revokeManagementUser',TOKEN,id);toast('Management access removed');await load()}catch(e){toast(e.message||'Could not remove access')}}
async function loadAudit(){const target=document.getElementById('auditRows');if(!target||!TOKEN)return;const filters={user:(document.getElementById('auditUser')||{}).value||'',area:(document.getElementById('auditArea')||{}).value||'',date:(document.getElementById('auditDate')||{}).value||'',action:(document.getElementById('auditAction')||{}).value||'',limit:200};try{const data=await pmdCall('getManagementAuditLog',TOKEN,filters);renderAuditFilters(data);renderAuditRows(data.rows||[])}catch(e){target.innerHTML='<div class="auditEmpty">'+esc(e.message||'Could not load activity log')+'</div>'}}
function renderAuditFilters(data){const u=document.getElementById('auditUser'),a=document.getElementById('auditArea');if(!u||!a)return;const uv=u.value,av=a.value;u.innerHTML='<option value="">All users</option>'+(data.users||[]).map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');a.innerHTML='<option value="">All areas</option>'+(data.areas||[]).map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');u.value=uv;a.value=av}
function renderAuditRows(rows){const target=document.getElementById('auditRows');if(!rows.length){target.innerHTML='<div class="auditEmpty">No activity matches those filters.</div>';return}target.innerHTML=`<div class="auditTableWrap"><table class="auditTable"><thead><tr><th>Time</th><th>User</th><th>Area</th><th>Action</th><th>Detail</th><th>Result</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.timestamp)}</td><td><b>${esc(r.user)}</b></td><td>${esc(r.area)}</td><td>${esc(r.action)}</td><td>${esc(r.detail||'—')}</td><td class="${String(r.result||'').startsWith('Failed')?'auditFail':'auditOk'}">${esc(r.result||'')}</td></tr>`).join('')}</tbody></table></div>`}
function clearAuditFilters(){document.getElementById('auditUser').value='';document.getElementById('auditArea').value='';document.getElementById('auditDate').value='';document.getElementById('auditAction').value='';loadAudit()}
</script>
</body>
</html>
