<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Perranporth AFC Live</title>
  <meta name="theme-color" content="#0b5ea8">
  <style>
    :root{--blue:#0b5ea8;--dark:#123b5d;--pale:#eaf4fb;--bg:#f3f6f8;--card:#fff;--line:#dce5eb;--text:#17212b;--muted:#70808d;--green:#1f7a36;--red:#c62828;--amber:#996b00}
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);-webkit-text-size-adjust:100%}
    .app{max-width:760px;margin:0 auto;padding:max(10px,env(safe-area-inset-top)) 10px max(28px,env(safe-area-inset-bottom))}
    .card{background:var(--card);border:1px solid #e8eef2;border-radius:18px;padding:16px;margin-bottom:10px;box-shadow:0 1px 5px #0000000c}
    .top{display:flex;align-items:center;gap:12px}.badge{width:54px;height:54px;border-radius:50%;object-fit:cover;background:#fff}.club{font-size:21px;font-weight:900;color:var(--dark)}.small{font-size:12px;color:var(--muted)}
    .livepill{margin-left:auto;border-radius:999px;padding:7px 11px;font-size:12px;font-weight:900;background:#e8f5e9;color:#155b29}.livepill.ht{background:#fff6d9;color:#755400}.livepill.ft{background:#e8edf1;color:#41515e}
    .competition{text-align:center;font-size:13px;font-weight:800;color:var(--muted);margin-bottom:13px;text-transform:uppercase;letter-spacing:.4px}
    .scoregrid{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;text-align:center}.team{font-size:17px;font-weight:900}.score{font-size:42px;font-weight:900;color:var(--dark);white-space:nowrap}.minute{text-align:center;margin-top:8px;font-size:14px;font-weight:800;color:var(--green)}
    h2{font-size:17px;margin:0 0 12px;color:var(--dark)}
    .scorers{display:grid;grid-template-columns:1fr 1fr;gap:10px}.scorerCol{min-width:0}.scorer{font-size:13px;padding:5px 0;border-bottom:1px solid #eef2f5}.scorer:last-child{border-bottom:0}.right{text-align:right}
    .tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}.tab{border:0;border-radius:12px;min-height:44px;font-weight:800;background:#e7edf2;color:#263746}.tab.active{background:var(--blue);color:white}
    .lineup{display:grid;grid-template-columns:1fr 1fr;gap:10px}.lineupBox{border:1px solid var(--line);border-radius:14px;padding:12px}.lineupTitle{font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:900;margin-bottom:7px}.player{padding:6px 0;border-bottom:1px solid #eef2f5;font-size:14px;font-weight:700}.player:last-child{border-bottom:0}.player.off{text-decoration:line-through;color:#89959e}.tag{font-size:10px;border-radius:999px;padding:3px 6px;margin-left:5px;background:var(--pale);color:var(--dark);font-weight:900}.tag.on{background:#e8f5e9;color:#155b29}.tag.off{background:#fdeaea;color:#8a1e1e}
    .event{display:grid;grid-template-columns:46px 28px 1fr;gap:8px;align-items:start;padding:10px 0;border-bottom:1px solid #edf2f5}.event:last-child{border-bottom:0}.eventMin{font-weight:900;color:var(--dark)}.eventIcon{font-size:18px;text-align:center}.eventText{font-size:14px;line-height:1.35}.eventText b{display:block}.eventSub{font-size:12px;color:var(--muted);margin-top:2px}
    .updated{text-align:center;font-size:11px;color:var(--muted);padding:4px 0 1px}.empty{text-align:center;padding:30px 12px;color:var(--muted)}
    .demo{background:#fff8dd;border-color:#ebd487}.demoTitle{font-weight:900;color:#6d5200;margin-bottom:5px}.demoBtns{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.demoBtn{border:0;border-radius:10px;min-height:42px;padding:8px;font-size:12px;font-weight:800;background:#fff;border:1px solid #d9c77a;color:#5f4c00}
    .hidden{display:none!important}
    @media(max-width:520px){.app{padding:7px}.card{border-radius:14px;padding:13px}.badge{width:46px;height:46px}.club{font-size:18px}.score{font-size:36px}.team{font-size:15px}.lineup{grid-template-columns:1fr}.scorers{gap:6px}.demoBtns{grid-template-columns:1fr 1fr}}
  </style>
</head>
<body>
  <main class="app">
    <section class="card top">
      <img class="badge" src="https://images.weserv.nl/?url=www.perranporthafc.co.uk/wp-content/themes/sharkfin-1-4/images/perranporth-afc-large.jpg&output=png&w=180&h=180&fit=contain" alt="Perranporth AFC badge">
      <div><div class="club">Perranporth AFC</div><div class="small">Men's First Team • Live Match Centre</div></div>
      <div id="statusPill" class="livepill">LIVE</div>
    </section>

    <section class="card">
      <div id="competition" class="competition">Intermediate Cup • Round 1</div>
      <div class="scoregrid">
        <div id="homeTeam" class="team">Perranporth</div>
        <div id="score" class="score">2–1</div>
        <div id="awayTeam" class="team">TEST FC</div>
      </div>
      <div id="minute" class="minute">67'</div>
      <div class="scorers" style="margin-top:13px">
        <div id="homeScorers" class="scorerCol"></div>
        <div id="awayScorers" class="scorerCol right"></div>
      </div>
    </section>

    <section class="card">
      <div class="tabs">
        <button id="lineupTab" class="tab active" type="button">Current Lineup</button>
        <button id="updatesTab" class="tab" type="button">Match Updates</button>
      </div>

      <div id="lineupPanel">
        <div class="lineup">
          <div class="lineupBox"><div class="lineupTitle">On the pitch</div><div id="onPitch"></div></div>
          <div class="lineupBox"><div class="lineupTitle">Bench / used subs</div><div id="bench"></div></div>
        </div>
      </div>

      <div id="updatesPanel" class="hidden"><div id="events"></div></div>
    </section>

    <section id="demoPanel" class="card demo hidden">
      <div class="demoTitle">Demo controls</div>
      <div class="small">These only change this browser. They do not touch the real Match Centre.</div>
      <div class="demoBtns">
        <button class="demoBtn" type="button" data-demo="goal">⚽ Perran goal</button>
        <button class="demoBtn" type="button" data-demo="oppgoal">⚽ Opp goal</button>
        <button class="demoBtn" type="button" data-demo="sub">🔄 Make sub</button>
        <button class="demoBtn" type="button" data-demo="half">⏸ Half time</button>
        <button class="demoBtn" type="button" data-demo="second">▶ Second half</button>
        <button class="demoBtn" type="button" data-demo="full">🏁 Full time</button>
      </div>
    </section>
    <div id="updated" class="updated"></div>
  </main>

<script>
(() => {
  const demo = new URLSearchParams(location.search).get('demo') === '1';
  const state = {
    status:'LIVE', minute:67, home:'Perranporth', away:'TEST FC', competition:'Intermediate Cup • Round 1', homeScore:2, awayScore:1,
    starters:['Leo Osborne','Jake Allen','Dan Gilbert','Jack Smith','George Parkes','Luke Watson-Read','Kierren Faulkner','Rian Faulkner','Alex Taylor','Tom Goodman','Fin Stribley'],
    bench:['Ben Lawrence','Dan Ware','Gav Counter','Tyreece Gallaway'],
    off:['Fin Stribley'], on:['Ben Lawrence'],
    homeGoals:[{m:18,p:'Alex Taylor'},{m:54,p:'Tom Goodman'}], awayGoals:[{m:61,p:'TEST FC'}],
    events:[
      {m:64,i:'🔄',t:'Substitution',s:'Ben Lawrence on • Fin Stribley off'},
      {m:61,i:'⚽',t:'Goal — TEST FC',s:'Perranporth 2–1 TEST FC'},
      {m:58,i:'🟨',t:'Dan Gilbert booked',s:''},
      {m:54,i:'⚽',t:'GOAL! Tom Goodman',s:'Perranporth 2–0 TEST FC'},
      {m:18,i:'⚽',t:'GOAL! Alex Taylor',s:'Perranporth 1–0 TEST FC'}
    ]
  };

  const $=id=>document.getElementById(id);
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  function render(){
    $('competition').textContent=state.competition;
    $('homeTeam').textContent=state.home;
    $('awayTeam').textContent=state.away;
    $('score').textContent=state.homeScore+'–'+state.awayScore;
    $('minute').textContent=state.status==='FT'?'Full Time':state.status==='HT'?'Half Time':state.minute+"'";
    const pill=$('statusPill'); pill.textContent=state.status; pill.className='livepill'+(state.status==='HT'?' ht':state.status==='FT'?' ft':'');
    $('homeScorers').innerHTML=state.homeGoals.map(g=>`<div class="scorer">⚽ ${esc(g.p)} ${g.m}'</div>`).join('');
    $('awayScorers').innerHTML=state.awayGoals.map(g=>`<div class="scorer">${g.m}' ${esc(g.p)} ⚽</div>`).join('');

    const current=state.starters.filter(p=>!state.off.includes(p)).concat(state.on.filter(p=>!state.starters.includes(p)));
    $('onPitch').innerHTML=current.map(p=>`<div class="player">${esc(p)}${state.on.includes(p)?'<span class="tag on">ON</span>':''}</div>`).join('');
    const used=state.off.map(p=>`<div class="player off">${esc(p)}<span class="tag off">OFF</span></div>`);
    const unused=state.bench.filter(p=>!state.on.includes(p)).map(p=>`<div class="player">${esc(p)}</div>`);
    $('bench').innerHTML=used.concat(unused).join('') || '<div class="small">No substitutes</div>';
    $('events').innerHTML=state.events.map(e=>`<div class="event"><div class="eventMin">${e.m}'</div><div class="eventIcon">${e.i}</div><div class="eventText"><b>${esc(e.t)}</b>${e.s?`<div class="eventSub">${esc(e.s)}</div>`:''}</div></div>`).join('');
    $('updated').textContent='Last updated '+new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'});
  }

  function tab(which){
    const lineup=which==='lineup'; $('lineupPanel').classList.toggle('hidden',!lineup); $('updatesPanel').classList.toggle('hidden',lineup); $('lineupTab').classList.toggle('active',lineup); $('updatesTab').classList.toggle('active',!lineup);
  }
  $('lineupTab').addEventListener('click',()=>tab('lineup')); $('updatesTab').addEventListener('click',()=>tab('updates'));

  if(demo){
    $('demoPanel').classList.remove('hidden');
    document.querySelectorAll('[data-demo]').forEach(btn=>btn.addEventListener('click',()=>{
      const a=btn.dataset.demo;
      if(a==='goal'){state.minute=Math.min(90,state.minute+2);state.homeScore++;state.homeGoals.push({m:state.minute,p:'Alex Taylor'});state.events.unshift({m:state.minute,i:'⚽',t:'GOAL! Alex Taylor',s:`Perranporth ${state.homeScore}–${state.awayScore} ${state.away}`});state.status='LIVE'}
      if(a==='oppgoal'){state.minute=Math.min(90,state.minute+2);state.awayScore++;state.awayGoals.push({m:state.minute,p:state.away});state.events.unshift({m:state.minute,i:'⚽',t:'Goal — '+state.away,s:`Perranporth ${state.homeScore}–${state.awayScore} ${state.away}`});state.status='LIVE'}
      if(a==='sub'){
        const incoming=state.bench.find(p=>!state.on.includes(p)); const outgoing=state.starters.find(p=>!state.off.includes(p)&&p!=='Leo Osborne');
        if(incoming&&outgoing){state.minute=Math.min(90,state.minute+1);state.on.push(incoming);state.off.push(outgoing);state.events.unshift({m:state.minute,i:'🔄',t:'Substitution',s:`${incoming} on • ${outgoing} off`});}
      }
      if(a==='half'){state.status='HT';state.minute=45;state.events.unshift({m:45,i:'⏸',t:'Half Time',s:`Perranporth ${state.homeScore}–${state.awayScore} ${state.away}`})}
      if(a==='second'){state.status='LIVE';state.minute=46;state.events.unshift({m:46,i:'▶',t:'Second half underway',s:''})}
      if(a==='full'){state.status='FT';state.minute=90;state.events.unshift({m:90,i:'🏁',t:'Full Time',s:`Perranporth ${state.homeScore}–${state.awayScore} ${state.away}`})}
      render();
    }));
  } else {
    $('statusPill').textContent='NO LIVE MATCH'; $('statusPill').className='livepill ft';
    $('minute').textContent='No live match at the moment';
  }
  render();
})();
</script>
</body>
</html>
