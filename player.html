<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#136ab6">
<title>Perranporth Player Portal</title>
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="manifest" href="./manifest.webmanifest">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eef3f8;font-family:Arial,sans-serif;color:#15314a}
#loading{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:24px;background:#eef3f8;z-index:1}
#loading b{font-size:20px}#loading span{display:block;color:#6d7d8d;font-size:13px;margin-top:6px}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#eef3f8;z-index:2}
.fallback{position:fixed;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));z-index:3;text-align:center;display:none}
.fallback a{display:inline-block;background:#136ab6;color:#fff;text-decoration:none;font-weight:800;border-radius:11px;padding:11px 14px}
</style>
</head>
<body>
<div id="loading"><div><b>Player Portal</b><span>Opening Football PA…</span></div></div>
<iframe id="portal" title="Perranporth Player Portal" allow="clipboard-write"></iframe>
<div id="fallback" class="fallback"><a id="openDirect" target="_top">Open Player Portal</a></div>
<script>
const q=new URLSearchParams(location.search);
if(q.get('ghost')==='1'){
  location.replace('./player-legacy.html'+location.search);
}else{
  const target='https://football-pa-core-web.vercel.app/player-portal.html?team=d5bcdf95-40a2-4596-b044-e9c8bcabecbc&pin=1&legacy_host=1';
  const frame=document.getElementById('portal');
  const direct=document.getElementById('openDirect');
  direct.href=target;
  let loaded=false;
  frame.onload=()=>{loaded=true;document.getElementById('loading').style.display='none'};
  frame.src=target;
  setTimeout(()=>{if(!loaded)document.getElementById('fallback').style.display='block'},8000);
}
</script>
</body>
</html>
