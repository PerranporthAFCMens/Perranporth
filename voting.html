<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d5cab"><title>Perranporth Voting Centre</title><link rel="apple-touch-icon" href="./apple-touch-icon.png"><link rel="manifest" href="./manifest.webmanifest"><script src="./bridge-client.js"></script><script src="./button-feedback.js" defer></script><style>
:root{--blue:#0d5cab;--dark:#17212b;--muted:#6f7e8b;--line:#dce5ec;--bg:#f2f5f7;--green:#218b22;--red:#c62828}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px Arial,sans-serif;color:var(--dark)}.wrap{max-width:760px;margin:auto;padding:max(10px,env(safe-area-inset-top)) 10px 40px}.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:16px;margin-bottom:11px;box-shadow:0 4px 14px #173a5010}.hero{display:flex;align-items:center;gap:11px}.badge{width:56px;height:56px;border-radius:50%;object-fit:contain}.actions{margin-left:auto;display:flex;gap:7px}.iconBtn{border:1px solid var(--line);background:#e8eef3;color:var(--dark);border-radius:11px;padding:10px 12px;text-decoration:none;font-weight:800}.hidden{display:none!important}.muted{color:var(--muted);font-size:13px}h1{font-size:22px;margin:0 0 3px}h2{font-size:18px;margin:0 0 11px}h3{font-size:15px;margin:16px 0 7px}input,select{width:100%;min-height:46px;border:1px solid #ccd8e2;border-radius:10px;background:#fff;padding:10px;font-size:15px}.btn{border:0;border-radius:10px;min-height:46px;padding:10px 13px;background:var(--blue);color:#fff;font-weight:800;font-size:15px;cursor:pointer}.btn.full{width:100%}.btn.secondary{background:#e6edf3;color:var(--dark)}.btn.green{background:var(--green)}.btn.red{background:var(--red)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #edf1f4}.row:last-child{border:0}.pill{display:inline-block;background:#edf2f6;border-radius:999px;padding:5px 8px;margin:2px;font-size:12px}.pill.open{background:#e6f6e9;color:#17682a}.pill.closed{background:#fdeaea;color:#9e2020}.dotd{border:1px solid #eceff2;border-radius:10px;padding:10px;margin:7px 0}.reason{font-size:13px;color:var(--muted);padding-top:5px}.login{max-width:400px;margin:10vh auto}.topline{display:flex;align-items:center;gap:10px}@media(max-width:600px){.grid2{grid-template-columns:1fr}.actions{gap:4px}.iconBtn{padding:9px}}
</style></head><body><div class="wrap">
<div id="pinView" class="card login"><h2>Voting Centre</h2><div class="muted" style="margin-bottom:12px">Management access only</div><input id="pin" type="password" inputmode="numeric" placeholder="Management PIN"><button class="btn full" style="margin-top:9px" onclick="login()">Open Voting Centre</button></div>
<div id="app" class="hidden"><div class="card hero"><img class="badge" src="./apple-touch-icon.png"><div><h1>Voting Centre</h1><div class="muted">Perranporth AFC · 2026/27</div></div><div class="actions"><a class="iconBtn" href="./">Home</a><button class="iconBtn" onclick="location.reload()">↻</button></div></div>
<div class="card"><h2>Voting match</h2><select id="match" onchange="matchChanged()"></select><div id="status" style="margin:11px 0"></div><div class="grid2"><button class="btn green" onclick="openVoting()">Open voting</button><button id="closeBtn" class="btn red" onclick="closeVoting()">Close voting</button></div></div>
<div class="card"><h2>Player voting link</h2><input id="link" readonly><button class="btn secondary full" style="margin-top:8px" onclick="copyLink()">Copy voting link</button></div>
<div class="card"><div class="topline"><div><h2 style="margin-bottom:3px">Voting information</h2><div id="ballots" class="muted">Loading…</div></div></div><div id="results"></div></div></div></div>
<script>
const KEY='pmd_admin_auth';let PIN='',D=null,selected='';const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[c]));
const saved=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){return null}},save=x=>localStorage.setItem(KEY,JSON.stringify(x)),clear=()=>localStorage.removeItem(KEY);
async function boot(){const s=saved();if(s?.token&&s.expiresAt>Date.now()){try{if(await pmdCall('verifyPin',s.token)){PIN=s.token;return openApp()}}catch(e){}clear()}setTimeout(()=>$('pin').focus(),40)}
async function login(){const p=$('pin').value.trim();if(!p)return alert('Enter PIN');try{const s=await pmdCall('createAdminSession',p);PIN=s.token;save(s);openApp()}catch(e){alert(e.message||'Incorrect PIN')}}
async function openApp(){$('pinView').classList.add('hidden');$('app').classList.remove('hidden');await load()}
const dt=s=>{const p=String(s||'').split('/');return p.length===3?new Date(+p[2],+p[1]-1,+p[0]):new Date(0)};
function defaultMatch(ms,openId){if(openId&&ms.some(m=>m.matchId===openId))return openId;const c=ms.filter(m=>m.status==='Completed').sort((a,b)=>dt(b.date)-dt(a.date));return c[0]?.matchId||ms.find(m=>m.status==='Live')?.matchId||ms[0]?.matchId||''}
async function load(){D=await pmdCall('getVotingAdminData',PIN);const ms=D.matches||[];selected=defaultMatch(ms,D.openMatchId);$('match').innerHTML=ms.map(m=>`<option value="${esc(m.matchId)}">${esc(m.date)} — ${esc(m.opponent)} (${esc(m.venue)})${m.status==='Completed'?' — FT':m.status==='Live'?' — LIVE':''}</option>`).join('');if(selected)$('match').value=selected;$('link').value=D.votingUrl||'https://ajtbenanbar.github.io/Perranporth/vote.html';status();await results()}
function status(){const isOpen=D.votingOpen&&D.openMatchId===selected,current=D.votingOpen&&D.openMatchId;if(isOpen)$('status').innerHTML='<span class="pill open">Voting OPEN</span> <span class="muted">This is the current voting match.</span>';else if(current){const m=(D.matches||[]).find(x=>x.matchId===D.openMatchId);$('status').innerHTML=`<span class="pill closed">Selected match CLOSED</span> <span class="muted">Voting is open for ${esc(m?.opponent||D.matchName||'another match')}.</span>`}else $('status').innerHTML='<span class="pill closed">Voting CLOSED</span>';$('closeBtn').disabled=!D.votingOpen}
async function matchChanged(){selected=$('match').value;status();await results()}
async function openVoting(){if(!selected)return;D=await pmdCall('openVoting',PIN,selected);status();await results()}
async function closeVoting(){D=await pmdCall('closeVoting',PIN);status()}
async function results(){if(!selected){$('ballots').textContent='No match selected';$('results').innerHTML='';return}$('ballots').textContent='Loading…';try{const s=await pmdCall('getVotingSnapshot',PIN,selected);$('ballots').textContent=`${s.ballots} ballot${s.ballots===1?'':'s'} · ${s.matchName||''}`;const medals={1:'🥇',2:'🥈',3:'🥉'};$('results').innerHTML=`<h3>Top 3</h3>${s.top3?.length?s.top3.map(x=>`<div class="row"><span>${medals[x.rank]||''} ${x.joint?'Joint ':''}${x.rank} — ${esc(x.player)}</span><span><b>${x.score}</b> <span class="muted">(${x.three}×3, ${x.two}×2, ${x.one}×1)</span></span></div>`).join(''):'<div class="muted">No votes yet.</div>'}<h3>Dick of the Day</h3>${s.dotd?.length?s.dotd.map(x=>`<div class="dotd"><b>${esc(x.player)} — ${x.votes}</b>${(x.reasons||[]).map(r=>`<div class="reason">${esc(r)}</div>`).join('')}</div>`).join(''):'<div class="muted">No votes yet.</div>'}<h3>Who's voted</h3><div>${s.voters?.length?s.voters.map(x=>`<span class="pill">${esc(x)}</span>`).join(''):'<span class="muted">None yet</span>'}</div><h3>Still to vote</h3><div>${s.stillToVote?.length?s.stillToVote.map(x=>`<span class="pill">${esc(x)}</span>`).join(''):'<span class="muted">Everyone has voted</span>'}</div>`}catch(e){$('ballots').textContent='Could not load voting information';$('results').innerHTML=`<div class="muted">${esc(e.message)}</div>`}}
async function copyLink(){const l=$('link').value;try{await navigator.clipboard.writeText(l);alert('Voting link copied')}catch(e){$('link').select();document.execCommand('copy');alert('Voting link copied')}}
$('pin').addEventListener('keydown',e=>{if(e.key==='Enter')login()});boot();
</script></body></html>
