<!DOCTYPE html>
<html>
<head>
  <title>Player Minutes — Perranporth AFC</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b67d1">
  <style>
    :root{--blue:#0b67d1;--ink:#17212b;--muted:#6d7b88;--bg:#eef3f8;--line:#dbe4ec;--green:#23811c}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink)}
    .wrap{max-width:900px;margin:0 auto;padding:18px 12px 36px}
    .hero,.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:12px;box-shadow:0 4px 14px #1e37500d}
    .hero{display:flex;align-items:center;gap:12px}.badge{width:58px;height:58px;border-radius:50%;object-fit:contain}.heroText{flex:1}
    h1{font-size:23px;margin:0;color:#123b5d}h2{font-size:18px;margin:0 0 12px}.muted{color:var(--muted);font-size:13px}.hidden{display:none!important}
    .btn{border:0;border-radius:12px;min-height:46px;padding:11px 14px;background:var(--blue);color:#fff;font-size:15px;font-weight:800;cursor:pointer;text-decoration:none;text-align:center;display:inline-flex;align-items:center;justify-content:center}.btn.secondary{background:#e7edf2;color:#263746}.btn.full{width:100%}
    input,select{width:100%;min-height:48px;border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff;font-size:16px}
    .tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.tabs .btn.active{background:var(--blue);color:#fff}.tabs .btn:not(.active){background:#e7edf2;color:#263746}
    .tableWrap{overflow:auto;border:1px solid var(--line);border-radius:12px}table{width:100%;border-collapse:collapse;background:#fff;min-width:650px}th,td{padding:10px 9px;border-bottom:1px solid #edf1f4;text-align:left;font-size:13px}th{background:#f5f8fa;position:sticky;top:0}td.num,th.num{text-align:right}.player{font-weight:800}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#edf4fb;font-size:11px;font-weight:800}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.stat{background:#f5f8fa;border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}.stat b{display:block;font-size:22px;color:#123b5d}.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#17212b;color:#fff;padding:10px 15px;border-radius:20px;display:none;z-index:99}
    @media(max-width:620px){.wrap{padding:10px 8px 24px}.hero,.card{border-radius:14px;padding:13px}.badge{width:48px;height:48px}.summary{grid-template-columns:1fr 1fr}h1{font-size:20px}}
  </style>
  <script src="./bridge-live.js"></script>
  <script src="./button-feedback.js" defer></script>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <img class="badge" src="https://www.perranporthafc.co.uk/wp-content/themes/sharkfin-1-4/images/perranporth-afc-large.jpg" alt="Perranporth AFC">
    <div class="heroText"><h1>Player Minutes</h1><div class="muted">2026/27 First Team</div></div>
    <a class="btn secondary" href="./" target="_top">Home</a>
  </div>

  <div id="loginCard" class="card">
    <h2>Management access</h2>
    <input id="pin" type="password" inputmode="numeric" placeholder="Enter PIN">
    <button id="loginBtn" class="btn full" style="margin-top:9px" onclick="login()">Open Player Minutes</button>
  </div>

  <div id="app" class="hidden">
    <div class="card">
      <div class="tabs">
        <button id="seasonTab" class="btn active" onclick="showTab('season')">Season Summary</button>
        <button id="matchTab" class="btn" onclick="showTab('match')">By Match</button>
      </div>
      <div id="seasonPane">
        <div id="seasonSummary" class="summary"></div>
        <div id="seasonTable"></div>
      </div>
      <div id="matchPane" class="hidden">
        <select id="matchSelect" onchange="renderMatch()"></select>
        <div id="matchTable" style="margin-top:10px"></div>
      </div>
    </div>
  </div>
</div>
<div id="toast" class="toast"></div>
<script>
let TOKEN='',DATA=null;
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';setTimeout(()=>t.style.display='none',2300)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function val(id){return document.getElementById(id).value}
async function boot(){
  let saved='';try{saved=localStorage.getItem('pmd_admin_auth')||''}catch(e){}
  if(saved){
    try{if(await pmdCall('verifyPin',saved)){TOKEN=saved;await load();return}}catch(e){}
    try{localStorage.removeItem('pmd_admin_auth')}catch(e){}
  }
}
async function login(){
  const pin=val('pin').trim();if(!pin)return toast('Enter PIN');
  const btn=document.getElementById('loginBtn');btn.disabled=true;btn.textContent='Opening…';
  try{
    if(!await pmdCall('verifyPin',pin)){toast('Incorrect PIN');return}
    TOKEN=await pmdCall('createAdminSession',pin);
    try{localStorage.setItem('pmd_admin_auth',TOKEN)}catch(e){}
    await load();
  }catch(e){toast(e.message||'Could not open Player Minutes')}
  finally{btn.disabled=false;btn.textContent='Open Player Minutes'}
}
async function load(){
  DATA=await pmdCall('getPlayerMinutesData',TOKEN);
  document.getElementById('loginCard').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  renderSeason();
  const sel=document.getElementById('matchSelect');
  sel.innerHTML=(DATA.matches||[]).map(m=>`<option value="${esc(m.matchId)}">${esc(m.date)} — ${esc(m.opponent)} (${esc(m.venue)})</option>`).join('');
  renderMatch();
}
function showTab(tab){
  document.getElementById('seasonPane').classList.toggle('hidden',tab!=='season');
  document.getElementById('matchPane').classList.toggle('hidden',tab!=='match');
  document.getElementById('seasonTab').classList.toggle('active',tab==='season');
  document.getElementById('matchTab').classList.toggle('active',tab==='match');
}
function renderSeason(){
  const rows=DATA.season||[];
  const totalApps=rows.reduce((n,p)=>n+Number(p.appearances||0),0);
  const totalMinutes=rows.reduce((n,p)=>n+Number(p.minutes||0),0);
  document.getElementById('seasonSummary').innerHTML=`<div class="stat"><b>${rows.length}</b><span class="muted">players used</span></div><div class="stat"><b>${totalApps}</b><span class="muted">player apps</span></div><div class="stat"><b>${totalMinutes}</b><span class="muted">player minutes</span></div>`;
  document.getElementById('seasonTable').innerHTML=rows.length?`<div class="tableWrap"><table><thead><tr><th>Player</th><th class="num">Starts</th><th class="num">Sub Apps</th><th class="num">Apps</th><th class="num">Minutes</th><th class="num">Avg</th></tr></thead><tbody>${rows.map(p=>`<tr><td class="player">${esc(p.player)}</td><td class="num">${p.starts}</td><td class="num">${p.subApps}</td><td class="num">${p.appearances}</td><td class="num"><b>${p.minutes}</b></td><td class="num">${p.averageMinutes}</td></tr>`).join('')}</tbody></table></div>`:'<div class="muted">No completed-match minutes yet.</div>';
}
function renderMatch(){
  const id=val('matchSelect');const m=(DATA.matches||[]).find(x=>x.matchId===id);
  if(!m){document.getElementById('matchTable').innerHTML='<div class="muted">No completed matches.</div>';return}
  const players=m.players||[];
  document.getElementById('matchTable').innerHTML=`<div class="muted" style="margin-bottom:8px">${esc(m.competition||'')} · ${esc(m.venue||'')}</div><div class="tableWrap"><table><thead><tr><th>Player</th><th>Status</th><th class="num">On</th><th class="num">Off</th><th class="num">Minutes</th></tr></thead><tbody>${players.map(p=>`<tr><td class="player">${esc(p.player)}</td><td><span class="pill">${esc(p.starter?'Starter':p.status||'Sub')}</span></td><td class="num">${p.minuteOn===''?'—':p.minuteOn}</td><td class="num">${p.minuteOff===''?'—':p.minuteOff}</td><td class="num"><b>${p.minutesPlayed}</b></td></tr>`).join('')}</tbody></table></div>`;
}
window.addEventListener('load',boot);
</script>
</body>
</html>
